<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindmap Generator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; }
  .container { max-width: 800px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.4rem; margin-bottom: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
  .hint { font-weight: 400; color: #888; font-size: 0.8rem; }
  input[type="text"], textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95rem; font-family: inherit; }
  textarea { resize: vertical; min-height: 120px; }
  .field { margin-bottom: 14px; }
  .char-count { text-align: right; font-size: 0.8rem; color: #888; margin-top: 2px; }
  .char-count.over { color: #d32f2f; font-weight: 600; }
  .actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  button { padding: 10px 20px; border: none; border-radius: 4px; font-size: 0.95rem; cursor: pointer; }
  #btn-run { background: #1976d2; color: #fff; }
  #btn-run:hover { background: #1565c0; }
  #btn-run:disabled { background: #90caf9; cursor: not-allowed; }
  .btn-secondary { background: #e0e0e0; color: #333; padding: 6px 14px; font-size: 0.85rem; }
  .btn-secondary:hover { background: #bdbdbd; }
  #spinner { display: none; font-size: 0.9rem; color: #1976d2; }
  #error-box { display: none; margin-top: 16px; padding: 12px; border-radius: 4px; background: #ffebee; color: #c62828; font-size: 0.9rem; }
  #result-section { display: none; margin-top: 24px; }
  #result-section h2 { font-size: 1.1rem; margin-bottom: 8px; }
  .result-actions { display: flex; gap: 8px; margin-bottom: 8px; }
  pre { background: #263238; color: #eeffff; padding: 16px; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; max-height: 500px; overflow-y: auto; }
</style>
</head>
<body>
<div class="container">
  <h1>Mindmap Generator</h1>

  <div class="field">
    <label for="api-key">API Key</label>
    <input type="text" id="api-key" placeholder="X-API-Key">
  </div>

  <div class="field">
    <label for="reqcons">要件文 <span class="hint">（必須, 最大1000文字）</span></label>
    <textarea id="reqcons" maxlength="1000" placeholder="例: ECサイトの商品検索機能"></textarea>
    <div class="char-count"><span id="reqcons-count">0</span> / 1000</div>
  </div>

  <div class="field">
    <label for="qchar">品質特性指定 <span class="hint">（任意）</span></label>
    <input type="text" id="qchar" placeholder="例: 一般消費者">
  </div>

  <div class="field">
    <label for="ppc">テスト観点数 <span class="hint">（任意, 予約フィールド）</span></label>
    <input type="text" id="ppc" placeholder="例: 3">
  </div>

  <div class="actions">
    <button id="btn-run">実行</button>
    <span id="spinner">処理中...</span>
  </div>

  <div id="error-box"></div>

  <div id="result-section">
    <h2>結果</h2>
    <div class="result-actions">
      <button class="btn-secondary" id="btn-copy">コピー</button>
      <button class="btn-secondary" id="btn-download">ダウンロード</button>
    </div>
    <pre><code id="result-md"></code></pre>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
