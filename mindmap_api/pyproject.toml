[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindmap-api"
version = "0.1.0"
description = "Serial LLM workflow API for mindmap generation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "openai>=1.30,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.21,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mindmap_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
